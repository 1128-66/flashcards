<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>背诵抽认卡 · 章节导航</title>
<style>
:root{
  --bg:#12141a;
  --surface:#1a1d26;
  --surface-2:#21252f;
  --line:#2c313d;
  --text:#e6e8ee;
  --muted:#98a0b0;
  --accent:#1D9E75;
  --accent-soft:#5DCAA5;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  min-height:100vh;
}
.wrap{max-width:880px;margin:0 auto;padding:48px 20px 80px}
header{text-align:center;margin-bottom:40px}
.logo{
  width:56px;height:56px;border-radius:16px;margin:0 auto 18px;
  background:linear-gradient(135deg,var(--accent),#14624a);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;box-shadow:0 8px 24px rgba(29,158,117,.25);
}
h1{font-size:26px;font-weight:700;letter-spacing:1px}
.sub{color:var(--muted);font-size:14px;margin-top:10px;line-height:1.7}
.sub b{color:var(--accent-soft);font-weight:600}

/* 章节卡片网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.chapter{
  position:relative;display:block;text-decoration:none;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:22px 20px;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.chapter:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 28px rgba(29,158,117,.14)}
.chapter:hover .arrow{transform:translateX(3px);color:var(--accent-soft)}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;color:var(--accent-soft);background:var(--accent-dim,#14211c);
  border:1px solid rgba(93,202,165,.25);
  padding:4px 10px;border-radius:99px;margin-bottom:14px;
  font-family:ui-monospace,monospace;
}
.chapter h2{font-size:18px;font-weight:700;margin-bottom:8px}
.chapter p{font-size:13px;color:var(--muted);line-height:1.6}
.chapter .arrow{
  position:absolute;right:18px;bottom:18px;font-size:18px;color:var(--muted);
  transition:transform .18s ease,color .18s ease;
}
/* 占位卡片（预留位） */
.placeholder{
  border:1.5px dashed var(--line);background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:150px;color:var(--muted);border-radius:14px;
}
.placeholder .plus{font-size:24px;margin-bottom:6px;opacity:.6}
.placeholder span{font-size:13px}

footer{
  margin-top:48px;text-align:center;color:var(--muted);font-size:12px;line-height:2;
}
footer .tip{display:inline-block;background:var(--surface);border:1px solid var(--line);
  padding:10px 18px;border-radius:10px;font-size:12px;color:var(--muted);line-height:1.9}
footer .tip b{color:var(--accent-soft);font-weight:600}
@media (max-width:560px){
  .wrap{padding:32px 16px 60px}
  h1{font-size:22px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🎴</div>
    <h1>背诵抽认卡</h1>
    <p class="sub">按章节整理的背诵卡合集 · 点击章节开始学习<br>
      进度保存在本设备浏览器中，<b>换设备不影响互不干扰</b></p>
  </header>

  <nav class="grid">
    <!-- ===== 章节列表：每新增一章，复制下面一个 chapter 卡片改编号/标题/链接即可 ===== -->
    <a class="chapter" href="01-导论.html">
      <span class="badge">01</span>
      <h2>导论</h2>
      <p>全章核心概念与考点背诵卡</p>
      <span class="arrow">→</span>
    </a>
    <!-- ===== 章节列表结束 ===== -->

    <div class="placeholder">
      <div class="plus">＋</div>
      <span>更多章节即将加入</span>
    </div>
  </nav>

  <footer>
    <div class="tip">
      💡 小提示：手机浏览器可在菜单里选择「添加到主屏幕」，<br>
      把它变成一个独立 App 图标，随时点开即学
    </div>
  </footer>
</div>
</body>
</html>
